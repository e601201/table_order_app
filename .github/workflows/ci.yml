name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:   # Actions タブから手動デプロイも可能にする

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  js_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Run frontend unit tests (Vitest)
        run: npm test

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend assets (test)
        env:
          RAILS_ENV: test
        run: bin/vite build --mode test

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  # main への push（＝ PR マージ）で、全チェック通過後に Kamal で本番デプロイする。
  # 必要な GitHub Secrets:
  #   RAILS_MASTER_KEY … config/master.key の中身（.kamal/secrets が credentials を復号するのに使う）
  #   SSH_PRIVATE_KEY  … デプロイ先サーバ（root@153.120.44.106）の SSH 秘密鍵
  deploy:
    needs: [ scan_ruby, lint, js_test, test ]
    # PR では走らせず、main への push と手動実行（workflow_dispatch）時のみデプロイ
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest

    # 同時に複数デプロイが走らないよう直列化する（実行中のデプロイは中断しない）
    concurrency:
      group: kamal-deploy-production
      cancel-in-progress: false

    env:
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Rails master key
        # .kamal/secrets が config/master.key と `rails credentials:fetch` を参照するため復元する。
        # （RAILS_MASTER_KEY / POSTGRES_PASSWORD / LINE_* / KAMAL_REGISTRY_PASSWORD はすべて credentials から解決される）
        run: |
          echo "$RAILS_MASTER_KEY" > config/master.key
          chmod 600 config/master.key

      - name: Set up SSH key
        # config/deploy.yml の ssh.keys と同じパスに秘密鍵を配置し、サーバのホスト鍵を登録する
        run: |
          mkdir -p ~/.ssh/sakura_vps
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/sakura_vps/sakura_vps
          chmod 600 ~/.ssh/sakura_vps/sakura_vps
          ssh-keyscan -H 153.120.44.106 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Kamal deploy
        run: bin/kamal deploy
